<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matías Allo | Pricing y Procesos Digitales</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow-brand: #FFDF00;
      --red-action: #E63229;
      --red-hover: #C8231A;
      --dark-bg: #2B2B2B;
      --text-main: #1F1F1F;
      --text-muted: #666666;
      --bg-page: #F4F5F7;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--yellow-brand);
      background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Preloader corporativo con logo estático y spinner */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--yellow-brand);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      gap: 16px;
    }

    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-logo {
  width: 160px;
  height: auto;
  object-fit: contain;
}

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(230, 50, 41, 0.2);
      border-top: 4px solid var(--red-action);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .vcard-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      text-align: center;
      position: relative;
      padding-bottom: 24px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .vcard-container.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .profile-header {
      padding: 36px 24px 16px;
    }

    .avatar-wrapper {
      width: 130px;
      height: 130px;
      margin: 0 auto 16px;
      position: relative;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--card-bg);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      background-color: #EAEAEA;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .role {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .content-section {
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-card {
      background-color: var(--bg-page);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      border: 1px solid #E5E7EB;
      text-decoration: none;
      display: block;
      transition: all 0.2s ease;
    }

    .info-card:hover {
      background-color: #ECEFF3;
      transform: translateY(-1px);
    }

    .info-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .info-text {
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid #E5E7EB;
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    .btn:hover {
      background-color: var(--bg-page);
      transform: translateY(-1px);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .btn-primary {
      background-color: var(--red-action);
      color: #FFFFFF;
      border: none;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(230, 50, 41, 0.25);
    }

    .btn-primary svg {
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--red-hover);
    }

    /* Botón web: Fondo negro y letras doradas */
    .btn-gold {
      background-color: #000000 !important;
      color: #FFD700 !important;
      border: 1px solid #FFD700 !important;
    }

    .btn-gold svg {
      color: #FFD700 !important;
    }

    .btn-gold .arrow-icon {
      color: #FFD700 !important;
    }

    .btn-gold:hover {
      background-color: #1a1a1a !important;
    }

    .arrow-icon {
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Preloader seguro con logo estático y spinner -->
  <div id="preloader">
    <img src="https://lh3.googleusercontent.com/d/18L7-kMCnrxTvJlcMjCGNVfDLgJPTuhfX" alt="Sagitario" class="preloader-logo">
    <div class="spinner"></div>

  <div class="vcard-container" id="cardContainer">

      <!-- 5. Ubicación (Con vínculo directo a Google Maps) -->

      <!-- 7. Sitio Web (Fondo negro y letras doradas) -->

  </div>

  <script>
    // Generador universal vCard compatible con iOS y Android
    document.getElementById('downloadVCard').addEventListener('click', function(e) {
      e.preventDefault();
      const vcardData = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:Allo;Matías;;;",
        "FN:Matías Allo",
        "ORG:Pinturerías Sagitario",
        "TITLE:Pricing y Procesos Digitales",
        "TEL;TYPE=WORK,VOICE:+5491133089772",
        "EMAIL;TYPE=WORK:m.allo@pintureriasagitario.com.ar",
        "ADR;TYPE=WORK:;;Entre Ríos 1170;CABA;;;Argentina",
        "URL:https://www.pintureriasagitario.com.ar",
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Matias_Allo.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Control estricto y blindado del preloader a exactamente 2 segundos
    window.addEventListener('load', function() {
      setTimeout(function() {
        const preloader = document.getElementById('preloader');
        const card = document.getElementById('cardContainer');
        if(preloader) preloader.classList.add('hidden');
        if(card) card.classList.add('loaded');
      }, 2000);
    });

    // Respaldo de seguridad absoluto por si acaso
    setTimeout(function() {
      const preloader = document.getElementById('preloader');
      const card = document.getElementById('cardContainer');
      if(preloader && !preloader.classList.contains('hidden')) {
        preloader.classList.add('hidden');
        if(card) card.classList.add('loaded');
      }
    }, 2200);
  </script>

</body>
</html>
